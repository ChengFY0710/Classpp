[versions]
agp = "9.4.1"
# core-ktx 不受 Compose BOM 直管：显式声明对齐真实解析值，防止依赖图变动时
# 静默跌回旧版（曾声明 1.10.1、实际靠冲突仲裁跑 1.16.0，声明形同虚设）
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# 声明对齐实际解析（此前声明 2.6.1、实际被 activity-compose 传递解析到 2.9.4，
# 声明失真误导排查）；2.11.0 为 androidx.lifecycle 当前最新稳定
lifecycleRuntimeKtx = "2.11.0"
# Haze 2.0.1 的 Android runtime 依赖 androidx.activity:activity:1.13.0；按本文件惯例
# 把声明对齐到实际解析值，避免 activity-compose 1.12.4 与 activity 1.13.0 混跑
activityCompose = "1.13.0"
# AGP 9.4.1 内置 Kotlin 默认 KGP 2.2.10；此 ref 同时决定 KGP/编译器与 compose、
# serialization 插件版本（三者必须一致，否则 compose 编译器版本校验不通过）。
# 2.4.21 为当前最新稳定（2.5 仍 Beta1）；官方兼容窗 Gradle ≤9.7.0、AGP ≤9.3.1，
# 本项目 AGP 9.4.1 超一个小版本（官方允许）；实测构建/测试通过、产物 metadata 2.4.0。
kotlin = "2.4.21"
composeBom = "2026.09.00"
# 2.0.1 为当前最新稳定（2026-09-29 发布）。2.0 起拆分为 haze（核心基础设施）+
# haze-blur（内置 Blur）；由 Kotlin 2.4.20 / Compose Multiplatform 1.12.1 编译，
# 与项目 Kotlin 2.4.21、Compose BOM 2026.09.00（androidx.compose.ui 1.12.1）对齐。
# 注意 1.x 的 hazeEffect 块 API、HazeTint、HazeInputScale 在 2.0 已移除
haze = "2.0.1"
# 1.12.0 为 RC 未取；1.11.0 为最新稳定
kotlinxSerialization = "1.11.0"
# Shapes 1.2.1 由 Kotlin 2.4 编译（元数据 2.4.0），需项目 Kotlin ≥2.3 才能读取；
# 项目已升级 Kotlin 2.4.21，跟进最新稳定版（API 与 1.2.0 相同，仅依赖版本不同）。
kyantShapes = "1.2.1"
# Backdrop 2.0.1（AndroidLiquidGlass 的 CMP 正式版）为当前最新稳定（2026-08-26 发布），
# 与 Haze 2.0.1 同批次由 Kotlin 2.4.x / Compose Multiplatform 1.12.x 编译，与本项目的
# Kotlin 2.4.21、BOM 2026.09.00 对齐。仅用于底部导航栏玻璃样式（NavGlassPreferences 开关）；
# Android 端 lens 折射需 API 33+、blur 需 API 31+，低版本由调用侧门控回退原实现。
backdrop = "2.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
haze-core = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
kyant-shapes = { group = "io.github.kyant0", name = "shapes", version.ref = "kyantShapes" }
kyant-backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

